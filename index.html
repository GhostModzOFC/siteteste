<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#14171a"><title>Prime Burger's</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#16191d;--mu:#667085;--bd:#e4e7ec;--ac:#d62d20;--ye:#ffb400;--ok:#12805c;--soft:#f7f8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1113;--card:#171b1f;--tx:#eef0f2;--mu:#98a2ad;--bd:#293038;--soft:#1e2328;--ok:#34c48f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{background:linear-gradient(135deg,#14171a,#262b31);color:#fff;border-bottom:3px solid var(--ye);position:sticky;top:0;z-index:5}
.w{max-width:560px;margin:0 auto;padding:0 14px}.hb{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.hb b{font:700 22px Oswald,Impact,sans-serif;letter-spacing:.5px}.hb small{display:block;color:#b8bec6;font-size:12px}
h2{font:700 20px Oswald,Impact,sans-serif;margin:18px 0 10px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.item .ic{font-size:32px;flex:0 0 auto}.item .info{flex:1;min-width:0}.item .info b{display:block;font-size:15px}
.item .info span{color:var(--mu);font-size:12.5px;display:block;margin:2px 0 6px}.item .price{color:var(--ac);font-weight:700}
.stepper{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font:700 18px Inter;cursor:pointer}
.stepper button.add{background:var(--ac);border-color:var(--ac);color:#fff}
.stepper span{min-width:16px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.bar .w{display:flex;align-items:center;gap:12px;padding:0}
.bar .tot{flex:1}.bar .tot b{display:block;font:700 19px Oswald,sans-serif}.bar .tot span{color:var(--mu);font-size:12px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:linear-gradient(135deg,#e8402f,var(--ac));color:#fff;border:0;border-radius:14px;padding:15px;font:700 16px Inter,sans-serif;cursor:pointer}
.btn.g{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}.btn.w{background:#128c4a}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.row.t{font:700 22px Oswald,sans-serif;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}
.mu{color:var(--mu);font-size:13px}.ctr{text-align:center}.big{font-size:44px;text-align:center;margin-top:2px}
.codebox{margin-top:12px}.codebox textarea{width:100%;background:var(--soft);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:none}
.copybtn{margin-top:10px}.copybtn.done{background:linear-gradient(135deg,var(--ok),var(--ok))}
.badge{display:inline-block;font-size:11px;font-weight:700;background:#e6f6ee;color:var(--ok);border-radius:8px;padding:4px 9px;margin-bottom:10px}
.back{display:inline-block;color:var(--mu);text-decoration:none;font-size:13px;margin-bottom:6px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
</style></head><body>
<header><div class="w"><div class="hb"><div><b>🍔 Prime Burger's</b><small>Peça e pague por Pix</small></div><div id="cartTag" class="mu" style="font-size:13px"></div></div></div></header>
<main class="w" id="m"></main>
<div class="bar" id="bar" style="display:none"><div class="w"><div class="tot"><span>Total</span><b id="barTot">R$ 0,00</b></div><div style="flex:1"><button class="btn" id="goCheckout" type="button">Finalizar pedido</button></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

/* ---- configuração da loja: já vem pronta, edite os itens/preços abaixo ---- */
const STORE={nm:"Prime Burger's",wa:'34996982496',pix:'96e8723f-e70a-4c8e-87a6-b4a7903e7c58',mn:'Prime Burgers',mc:'Uberlandia'};
const MENU=[
 {id:'xb',n:'X-Burger',d:'Pão, hambúrguer 120g, queijo, alface e tomate',p:18.9,e:'🍔'},
 {id:'xbc',n:'X-Bacon',d:'Pão, hambúrguer 120g, queijo, bacon crocante',p:22.9,e:'🥓'},
 {id:'xsal',n:'X-Salada',d:'Pão, hambúrguer 120g, queijo, alface, tomate e maionese da casa',p:20.9,e:'🥬'},
 {id:'xtudo',n:'X-Tudo',d:'Pão, 2 hambúrgueres, queijo, bacon, ovo, presunto e salada',p:29.9,e:'🍖'},
 {id:'bat',n:'Batata Frita',d:'Porção individual crocante',p:14.9,e:'🍟'},
 {id:'ref',n:'Refrigerante Lata',d:'350ml, várias opções',p:0.10,e:'🥤'}
];
let cart={},view='menu';
const cartCount=()=>Object.values(cart).reduce((a,q)=>a+q,0);
const cartTotal=()=>MENU.reduce((a,i)=>a+(cart[i.id]||0)*i.p,0);
function setQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];renderMenu();renderBar()}

/* ---- Pix Copia e Cola (BR Code / EMV) — sem depender de nenhuma API ---- */
function crc16(str){let crc=0xFFFF;for(let i=0;i<str.length;i++){crc^=(str.charCodeAt(i)<<8);for(let b=0;b<8;b++){crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF}}return crc.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function pixSan(s,max){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').toUpperCase().trim().slice(0,max)||'NA'}
function buildPixCode(amount,txid){
 let mai=tlv('00','br.gov.bcb.pix')+tlv('01',STORE.pix.trim());
 let p=tlv('00','01')+tlv('01','11')+tlv('26',mai)+tlv('52','0000')+tlv('53','986')+tlv('54',amount.toFixed(2))+tlv('58','BR')+tlv('59',pixSan(STORE.mn,25))+tlv('60',pixSan(STORE.mc,15));
 const tx=(String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25))||'***';
 p+=tlv('62',tlv('05',tx));p+='6304';return p+crc16(p)
}
const wa=n=>{n=String(n||'').replace(/\D/g,'');return n&&!n.startsWith('55')?'55'+n:n};

function renderMenu(){
 $('#cartTag').textContent=cartCount()?cartCount()+' item(ns)':'';
 $('#m').innerHTML='<h2>Cardápio</h2>'+MENU.map(i=>`<div class="item"><div class="ic">${i.e}</div><div class="info"><b>${esc(i.n)}</b><span>${esc(i.d)}</span><span class="price">${R(i.p)}</span></div><div class="stepper">${cart[i.id]?`<button onclick="setQty('${i.id}',-1)">−</button><span>${cart[i.id]}</span>`:''}<button class="add" onclick="setQty('${i.id}',1)">+</button></div></div>`).join('')
}
function renderBar(){const c=cartCount();$('#bar').style.display=c?'flex':'none';$('#barTot').textContent=R(cartTotal())}
function goCheckout(){if(!cartCount())return;view='checkout';renderCheckout()}
function backMenu(){view='menu';renderMenu();renderBar()}
function renderCheckout(){
 const total=cartTotal(),num=Date.now().toString(36).toUpperCase().slice(-6),code=buildPixCode(total,'PB'+num);
 const itemsHtml=MENU.filter(i=>cart[i.id]).map(i=>`<div class="row"><span>${cart[i.id]}× ${esc(i.n)}</span><span>${R(i.p*cart[i.id])}</span></div>`).join('');
 $('#m').innerHTML=`<a class="back" onclick="backMenu()">‹ Voltar ao cardápio</a><h2>Seu pedido #${num}</h2>
 <div class="card">${itemsHtml}<div class="row t"><span>Total</span><span>${R(total)}</span></div></div>
 <div class="card"><label>Nome<input id="cn" placeholder="Seu nome"></label><label>WhatsApp (com DDD)<input id="cw" inputmode="tel" placeholder="34 99999-9999"></label></div>
 <div class="card ctr"><span class="badge">💠 Pague com Pix · grátis e na hora</span>
  <p class="mu" style="margin:0">Toque para copiar o código abaixo e cole no Pix Copia e Cola do seu banco.</p>
  <div class="big">${R(total)}</div>
  <div class="codebox"><textarea id="pixcode" rows="3" readonly onclick="this.select()">${code}</textarea></div>
  <div class="mu" id="ckErr" style="color:var(--ac);min-height:18px;margin-top:6px"></div>
  <button class="btn copybtn" id="cpbtn" type="button">Copiar código Pix</button>
  ${STORE.wa?`<button class="btn w" style="margin-top:8px" id="wabtn" type="button">Já paguei, avisar a loja</button>`:''}
 </div>`;
 $('#bar').style.display='none';
 const checkFields=()=>{const nm=$('#cn').value.trim(),ph=$('#cw').value.replace(/\D/g,'');
  if(!nm||ph.length<10){$('#ckErr').textContent='Preencha seu nome e WhatsApp com DDD para continuar.';return null}
  $('#ckErr').textContent='';return{nm,ph}};
 $('#cpbtn').onclick=async()=>{if(!checkFields())return;const ta=$('#pixcode'),btn=$('#cpbtn');ta.select();
  try{await navigator.clipboard.writeText(code)}catch(e){try{document.execCommand('copy')}catch(e2){}}
  btn.textContent='Copiado! ✅';btn.classList.add('done');setTimeout(()=>{btn.textContent='Copiar código Pix';btn.classList.remove('done')},2200)};
 if($('#wabtn'))$('#wabtn').onclick=()=>{const f=checkFields();if(!f)return;
  const msg=`Olá! Meu nome é ${f.nm}. Acabei de pagar o pedido #${num} (${R(total)}) via Pix. Segue o comprovante.`;
  window.open(`https://wa.me/${wa(STORE.wa)}?text=${encodeURIComponent(msg)}`,'_blank')}
}
$('#goCheckout').onclick=goCheckout;
renderMenu();renderBar();
</script></body></html>
