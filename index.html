 <div class="card"><h3>Maquininha e aplicativos</h3><div class="row g-p hd"><span>Forma</span><span>% das vendas</span><span>Taxa (%)</span></div>${S.pay.map((p,n)=>`<div class="row g-p"><b>${esc(p.n)}</b>${I(`pay.${n}.s`,p.s)}${I(`pay.${n}.f`,p.f)}</div>`).join('')}
 <div class="tot"><span>Soma das vendas (100%)</span><span data-o="sh"></span></div><div class="tot"><span>Taxa média da maquininha</span><span data-o="pay"></span></div>
 <div class="row g-3" style="margin-top:12px"><label>Comissão de aplicativo, pedidos "App" (%)${I('app',S.app)}</label><div class="st"><small>Impostos + taxas sobre a venda</small><b data-o="vr"></b></div></div></div>`}
function vCfg(){return `<div class="card"><h3>Negócio e meta</h3><div class="row g-3"><label>WhatsApp (com DDD)${I('biz.whats',S.biz.whats,1)}</label><label>Instagram${I('biz.ig',S.biz.ig,1)}</label><label>Meta de faturamento mensal (R$)${I('goal',S.goal)}</label></div></div>
 <div class="card"><h3>Segurança (PIN)</h3><p class="mu">Peça um PIN ao abrir o sistema. Deixe vazio para desativar. Trava simples deste aparelho, não substitui criptografia.</p><div class="row g-3"><label>PIN${I('pin',S.pin,1)}</label></div></div>
 <div class="card"><h3>Backup e recuperação</h3><button class="ghost" data-a="exp">Exportar backup (.json)</button><button class="ghost" data-a="rb">Recuperar backup automático (ontem)</button><label>Importar backup<input type="file" id="impF" accept="application/json"></label><button class="ghost" data-a="rs" style="margin-top:10px">Restaurar dados de exemplo</button></div>
 <div class="card"><h3>Histórico de alterações</h3>${S.log.slice(0,20).map(l=>`<p class="small">${fd(l.ts)} · ${esc(l.m)}</p>`).join('')||'<p class="mu">Nada ainda.</p>'}</div>`}
const VIEWS={dash:vDash,ped:vPed,prod:vProd,ing:vIng,est:vEst,forn:vForn,cli:vCli,cx:vCx,rel:vRel,menu:vMenu,cust:vCust,cfg:vCfg};
function render(){$('#nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-i="${t[0]}" class="${t[0]===tab?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('');calc();$('#main').innerHTML=VIEWS[tab]();upd();filt()}
function filt(){if(tab!=='prod')return;document.querySelectorAll('#main>.card').forEach(cd=>{const n=cd.querySelector('input.name'),s=cd.querySelector('select[data-t]');if(!n)return;cd.style.display=n.value.toLowerCase().includes(searchQ.toLowerCase())&&(filtCat==='Todos'||s.value===filtCat)?'':'none'})}
function setP(path,v){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
/* ===== eventos ===== */
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='pq'){searchQ=t.value;filt();return}
 if(t.id==='fq'){document.querySelectorAll('.g-s[data-nm]').forEach(r=>r.style.display=r.dataset.nm.includes(t.value.toLowerCase())?'':'none');return}
 if(t.id==='cc'){$('#cd').textContent=R(N(t.value)-N(t.dataset.ex));return}
 if(t.dataset.f){of[t.dataset.f]=t.value;const o=$('#ot');if(o)o.textContent=R(ctot().total);return}
 if(t.dataset.c!=null&&t.dataset.c!==''){cart[+t.dataset.c].q=Math.max(1,parseInt(t.value)||1);const o=$('#ot');if(o)o.textContent=R(ctot().total);return}
 if(!t.dataset.p)return;setP(t.dataset.p,t.dataset.t==='s'?t.value:t.dataset.t==='b'?t.checked:N(t.value));calc();upd();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='pc'){filtCat=t.value;filt();return}
 if(t.dataset.a==='reg'){S.tax.i=+t.value;if(TX[S.tax.i][1]!==null)S.tax.rate=TX[S.tax.i][1];render();save();return}
 if(t.dataset.r){rp[t.dataset.r]=t.value;render();return}
 if(t.dataset.f==='pay'||t.dataset.f==='org')return;
 if(t.dataset.os){const o=S.orders.find(x=>x.id===t.dataset.os),old=o.st;o.st=t.value;if(t.value==='Cancelado'&&old!=='Cancelado')mvS(o,-1);else if(old==='Cancelado'&&t.value!=='Cancelado')mvS(o,1);lg('Pedido #'+o.num+': '+old+' → '+t.value);save();render();return}
 if(t.id==='impF'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&Array.isArray(d.prods)){S=fix(d);lg('Backup importado');tab='dash';save();render()}}catch(err){alert('Arquivo inválido')}};r.readAsText(f);return}
 if(tab==='est'&&t.dataset.p)render()});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b||!['dp','di','df','ds','dcl','rs','rb','fcx'].includes(b.dataset.a))return;
 if(b.dataset.arm==='1')return;e.stopImmediatePropagation();b.dataset.arm='1';const o=b.innerHTML;b.textContent=b.classList.contains('x')?'Certeza?':'Confirmar?';b.classList.add('arm');
 setTimeout(()=>{b.dataset.arm='';b.innerHTML=o;b.classList.remove('arm')},3000)},true);
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
 if(a==='tab'){tab=b.dataset.i}
 else if(a==='af')S.fixed.push({n:'Novo custo',v:0});
 else if(a==='df'){lg('Custo removido: '+S.fixed[i].n);S.fixed.splice(i,1)}
 else if(a==='ai')S.ing.push({id:'i'+uid(),n:'Novo ingrediente',p:0,q:1,u:'g',stk:0,min:0});
 else if(a==='di'){lg('Ingrediente removido: '+S.ing[i].n);S.ing.splice(i,1)}
 else if(a==='ap')S.prods.push({id:'p'+uid(),n:'Novo produto',t:'Hambúrguer',e:0,m:30,pp:0,promo:0,act:true,desc:'',l:[]});
 else if(a==='dp'){lg('Produto removido: '+S.prods[i].n);S.prods.splice(i,1)}
 else if(a==='al')S.prods[i].l.push({r:S.ing.length?'i:'+S.ing[0].id:'',q:1});
 else if(a==='dl')S.prods[i].l.splice(j,1);
 else if(a==='cp'){const c=JSON.parse(JSON.stringify(S.prods[i]));c.id='p'+uid();c.n+=' (cópia)';S.prods.splice(i+1,0,c)}
 else if(a==='pr'){window.print();return}
 else if(a==='as')S.sup.push({n:'Novo fornecedor',c:'',b:'',p:''});
 else if(a==='ds'){lg('Fornecedor removido: '+S.sup[i].n);S.sup.splice(i,1)}
 else if(a==='acl')S.cli.push({n:'Novo cliente',t:'',a:''});
 else if(a==='dcl'){lg('Cliente removido: '+S.cli[i].n);S.cli.splice(i,1)}
 else if(a==='ac'){const pid=$('#cP').value;if(!pid)return;const q=Math.max(1,parseInt($('#cQ').value)||1),x=cart.find(c=>c.pid===pid);x?x.q+=q:cart.push({pid,q})}
 else if(a==='cr')cart.splice(i,1);
 else if(a==='fo'){if(!cart.length){alert('Adicione ao menos um produto.');return}
  const it=cart.map(c=>{const p=S.prods.find(x=>x.id===c.pid),q=PR[c.pid];return{pid:c.pid,n:p.n,q:c.q,price:q.sell,cost:q.cost}}),total=ctot().total,pay=of.pay||S.pay[0].n,pm=S.pay.find(x=>x.n===pay),fr=(pm?pm.f:0)+(of.org==='App'?S.app:0),tax=total*tr/100,fee=total*fr/100,cost=it.reduce((s,x)=>s+x.cost*x.q,0);
  const o={id:'o'+uid(),num:++S.seq,ts:Date.now(),cli:of.cli.trim(),pay,org:of.org,disc:N(of.disc),dfee:N(of.fee),obs:of.obs,st:'Novo',it,total,cost,tax,fee,profit:total-cost-tax-fee,k:(tr+fr)/100};
  S.orders.unshift(o);mvS(o,1);lg('Pedido #'+o.num+' criado ('+R(total)+')');cart=[];of={cli:'',pay:'',disc:0,fee:0,obs:'',org:'Balcão'}}
 else if(a==='ent'){const i2=S.ing.find(x=>x.id===$('#eI').value),qt=N($('#eQ').value),pd=N($('#eV').value);if(!i2||qt<=0)return;
  const uo=i2.q>0?i2.p/i2.q:0,un=pd/qt;if(pd>0){i2.p=(Math.max(0,i2.stk)*uo+pd)/(Math.max(0,i2.stk)+qt)*i2.q;i2.up=uo>0&&un>uo*1.05?(un/uo-1)*100:0}
  i2.stk+=qt;const sp=$('#eS').value;S.stkLog.unshift({ts:Date.now(),n:i2.n,q:qt,u:i2.u,t:'Entrada'+(sp?' ('+sp+')':'')+(pd?' · '+R(pd):'')});lg('Entrada: '+i2.n)}
 else if(a==='abr'){S.cash.o={ts:Date.now(),ini:N($('#ci').value)};lg('Caixa aberto')}
 else if(a==='mvc'){const v=N($('#mv').value);if(v<=0)return;S.cash.mv.push({ts:Date.now(),t:b.dataset.k,v,n:$('#mn').value})}
 else if(a==='fcx'){const c=S.cash,el=$('#cc');if(!c.o||!el||el.value==='')return alert('Informe o dinheiro contado.');const ex=N(el.dataset.ex),cnt=N(el.value);c.h.unshift({a:c.o.ts,f:Date.now(),ex,cnt,d:cnt-ex});lg('Caixa fechado (diferença '+R(cnt-ex)+')');c.o=null;c.mv=[]}
 else if(a==='csv'){const[x,y]=rng(),rows=[['Nº','Data','Cliente','Pagamento','Origem','Status','Itens','Desconto','Entrega','Total','Custo','Imposto','Taxas','Lucro']];
  S.orders.filter(o=>{const d=dk(o.ts);return d>=x&&d<=y}).forEach(o=>rows.push([o.num,fd(o.ts),o.cli,o.pay,o.org,o.st,o.it.map(t=>t.q+'x '+t.n).join(' | '),o.disc,o.dfee,o.total,o.cost,o.tax,o.fee,o.profit].map(v=>typeof v==='number'?String(+v.toFixed(2)).replace('.',','):'"'+String(v??'').replace(/"/g,'""')+'"')));
  const u=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='relatorio-prime-burgers.csv';l.click();URL.revokeObjectURL(u);return}
 else if(a==='cpm'){const act=S.prods.filter(p=>p.act);let t="🍔 Cardápio Prime Burger's\n";[...new Set(act.map(p=>p.t))].forEach(c=>{t+='\n*'+c+'*\n'+act.filter(p=>p.t===c).map(p=>'• '+p.n+' — '+R(PR[p.id].sell)+(p.desc?'\n  '+p.desc:'')).join('\n')+'\n'});try{navigator.clipboard.writeText(t);b.textContent='Copiado ✓'}catch(err){prompt('Copie:',t)}return}
 else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='backup-prime-burgers.json';l.click();URL.revokeObjectURL(u);return}
 else if(a==='rb'){try{const d=JSON.parse(localStorage.getItem('pbak'));if(d&&d.prods){S=fix(d);lg('Backup automático recuperado')}else return alert('Sem backup automático.')}catch(err){return alert('Sem backup automático.')}}
 else if(a==='rs'){S=fix(def());tab='dash'}
 else return;
 render();save();if(a==='tab')window.scrollTo(0,0)});
render();
if(S.pin){document.body.insertAdjacentHTML('afterbegin',`<div id="lk" style="position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;place-items:center;padding:20px"><div class="card" style="width:min(340px,100%)"><h3>🔒 Sistema Prime Burger's</h3><p class="mu">Digite o PIN para entrar.</p><input id="pi" type="password" inputmode="numeric" autofocus><button class="btn" id="pb" style="margin-top:10px;width:100%">Entrar</button></div></div>`);
 const go=()=>{if($('#pi').value===S.pin)$('#lk').remove();else{$('#pi').value='';$('#pi').placeholder='PIN incorreto'}};$('#pb').onclick=go;$('#pi').onkeydown=e=>{if(e.key==='Enter')go()}}
</script></body></html>
