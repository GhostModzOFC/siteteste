<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#161116"><title>Prime Burger's</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#1c1712;--mu:#7a7168;--bd:#eae5dd;--ac:#c8281f;--ac2:#e2432d;--ok:#137a53;--soft:#f9f6f2;--sh:0 10px 30px -12px rgba(28,23,18,.14);--nb:#fff4e0;--nbd:#f2d9a3;--nt:#7a5300;--bg2:#e6f6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131110;--card:#1e1a17;--tx:#f3efe9;--mu:#a89e93;--bd:#332c26;--soft:#241f1b;--ok:#3fcf95;--sh:0 10px 30px -12px rgba(0,0,0,.5);--nb:#33280e;--nbd:#4a3a13;--nt:#f2c96a;--bg2:#0f2b21}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
header{background:radial-gradient(120% 160% at 0% 0%,#2a1d16,#161116 60%);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 18px rgba(0,0,0,.25)}
.w{max-width:560px;margin:0 auto;padding:0 16px}
.hb{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px}.brand .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--ac2),var(--ac));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 16px -4px rgba(200,40,31,.6)}
.brand b{font:700 20px Oswald,Impact,sans-serif;letter-spacing:.2px;display:block}.brand small{color:#c9beb2;font-size:11.5px}
.cartpill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:#fff}
h2{font:700 19px Oswald,Impact,sans-serif;margin:20px 0 10px;letter-spacing:.2px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:11px;display:flex;gap:13px;align-items:center;box-shadow:var(--sh)}
.item .ic{font-size:30px;flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.item .info{flex:1;min-width:0}.item .info b{display:block;font-size:15px;font-weight:700}
.item .info span{color:var(--mu);font-size:12.5px;display:block;margin:3px 0 7px;line-height:1.4}.item .price{color:var(--ac);font-weight:800;font-size:14.5px}
.stepper{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.stepper button{width:32px;height:32px;border-radius:10px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font:700 18px Inter;cursor:pointer}
.stepper button.add{background:linear-gradient(135deg,var(--ac2),var(--ac));border-color:var(--ac);color:#fff}
.stepper span{min-width:16px;text-align:center;font-weight:800;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 -10px 24px -14px rgba(0,0,0,.18)}
.bar .w{display:flex;align-items:center;gap:12px;padding:0}
.bar .tot{flex:1}.bar .tot b{display:block;font:700 20px Oswald,sans-serif}.bar .tot span{color:var(--mu);font-size:11.5px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0;border-radius:14px;padding:15px;font:700 15.5px Inter,sans-serif;cursor:pointer;min-height:50px;box-shadow:0 10px 20px -8px rgba(200,40,31,.5);margin-top:10px}
.btn:disabled{opacity:.6;cursor:wait}.btn:focus-visible,input:focus-visible{outline:3px solid var(--ye,#f2b134);outline-offset:2px}
.btn.g{background:var(--soft);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.w{background:linear-gradient(135deg,#17a463,#0f7a49);box-shadow:0 10px 20px -8px rgba(15,122,73,.45)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}.row.t{font:700 21px Oswald,sans-serif;border-top:1px solid var(--bd);margin-top:8px;padding-top:12px}
label{display:block;font-size:12.5px;color:var(--mu);font-weight:600;margin-bottom:2px}
input{background:var(--soft);color:var(--tx);border:1px solid var(--bd);border-radius:13px;padding:13px;font:15px Inter;width:100%;margin-top:5px}
.mu{color:var(--mu);font-size:13px}.ctr{text-align:center}.er{color:var(--ac);font-size:13.5px;min-height:18px;margin-top:6px}
.back{display:inline-flex;color:var(--mu);font-size:13px;margin-bottom:8px;cursor:pointer;font-weight:600}
.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 16px}
.steps .dot{width:7px;height:7px;border-radius:50%;background:var(--bd)}.steps .dot.on{background:var(--ac);width:20px;border-radius:5px}
.notice{background:var(--nb);border:1px solid var(--nbd);color:var(--nt);border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.5;margin:12px 0}
.badge{display:inline-block;font-size:12px;font-weight:700;background:var(--bg2);color:var(--ok);border-radius:999px;padding:5px 12px;margin-bottom:10px}
.big{font:700 26px Oswald,sans-serif;margin:6px 0}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:18px;line-height:1.6}
</style></head><body>
<header><div class="w"><div class="hb"><div class="brand"><div class="ic">🍔</div><div><b>Prime Burger's</b><small>Peça agora, pague com Pix ou cartão</small></div></div><div class="cartpill" id="cartTag" style="display:none"></div></div></div></header>
<main class="w" id="m"></main>
<div class="bar" id="bar" style="display:none"><div class="w"><div class="tot"><span>Total do pedido</span><b id="barTot">R$ 0,00</b></div><div style="flex:1"><button class="btn" id="goCheckout" type="button" style="margin:0">Finalizar pedido</button></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const STORE={wa:'34996982496'};
// Os preços reais são conferidos no servidor (api/[action].js). Mantenha as duas listas iguais.
const MENU=[
 {id:'xb',n:'X-Burger',d:'Pão, hambúrguer 120g, queijo, alface e tomate',p:18.9,e:'🍔'},
 {id:'xbc',n:'X-Bacon',d:'Pão, hambúrguer 120g, queijo, bacon crocante',p:22.9,e:'🥓'},
 {id:'xsal',n:'X-Salada',d:'Pão, hambúrguer 120g, queijo, alface, tomate e maionese da casa',p:20.9,e:'🥬'},
 {id:'xtudo',n:'X-Tudo',d:'Pão, 2 hambúrgueres, queijo, bacon, ovo, presunto e salada',p:29.9,e:'🍖'},
 {id:'bat',n:'Batata Frita',d:'Porção individual crocante',p:14.9,e:'🍟'},
 {id:'ref',n:'Refrigerante Lata',d:'350ml, várias opções',p:0.03,e:'🥤'}
];
let cart={};
const cartCount=()=>Object.values(cart).reduce((a,q)=>a+q,0);
const cartTotal=()=>MENU.reduce((a,i)=>a+(cart[i.id]||0)*i.p,0);
const wa=n=>{n=String(n||'').replace(/\D/g,'');return n&&!n.startsWith('55')?'55'+n:n};
const waLink=t=>`https://wa.me/${wa(STORE.wa)}?text=${encodeURIComponent(t)}`;
function setQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];renderMenu()}
const stepsHtml=n=>`<div class="steps">${[1,2,3].map(i=>`<span class="dot${i===n?' on':''}"></span>`).join('')}</div>`;

function renderMenu(){
 $('#cartTag').style.display=cartCount()?'block':'none';$('#cartTag').textContent=cartCount()+' item(ns)';
 $('#m').innerHTML='<h2>Cardápio</h2>'+MENU.map(i=>`<div class="item"><div class="ic">${i.e}</div><div class="info"><b>${esc(i.n)}</b><span>${esc(i.d)}</span><span class="price">${R(i.p)}</span></div><div class="stepper">${cart[i.id]?`<button aria-label="Remover ${esc(i.n)}" onclick="setQty('${i.id}',-1)">−</button><span>${cart[i.id]}</span>`:''}<button class="add" aria-label="Adicionar ${esc(i.n)}" onclick="setQty('${i.id}',1)">+</button></div></div>`).join('')
 +`<div class="foot">Pagamento seguro pela InfinitePay, com Pix ou cartão.</div>`;
 $('#bar').style.display=cartCount()?'flex':'none';$('#barTot').textContent=R(cartTotal());
}

function renderCheckout(){
 const total=cartTotal();
 const itemsHtml=MENU.filter(i=>cart[i.id]).map(i=>`<div class="row"><span>${cart[i.id]}× ${esc(i.n)}</span><span>${R(i.p*cart[i.id])}</span></div>`).join('');
 $('#m').innerHTML=`<a class="back" onclick="renderMenu()">‹ Voltar ao cardápio</a>${stepsHtml(2)}
 <h2>Confira seu pedido</h2>
 <div class="card">${itemsHtml}<div class="row t"><span>Total</span><span>${R(total)}</span></div></div>
 <h2>Seus dados</h2>
 <div class="card"><label for="cn">Nome</label><input id="cn" autocomplete="name" placeholder="Seu nome completo"><div style="height:12px"></div>
 <label for="cw">WhatsApp</label><input id="cw" inputmode="tel" autocomplete="tel" placeholder="34 99999-9999"><div style="height:12px"></div>
 <label for="ce">E-mail (opcional)</label><input id="ce" type="email" autocomplete="email" placeholder="voce@email.com"></div>
 <div class="er" id="ckErr" role="alert"></div>
 <button class="btn" id="toPay" type="button">Pagar com Pix ou cartão</button>
 <p class="mu ctr">Você será levado à página segura da InfinitePay e volta aqui depois de pagar.</p>`;
 $('#bar').style.display='none';
 $('#toPay').onclick=async()=>{
  const nm=$('#cn').value.trim(),ph=$('#cw').value.replace(/\D/g,''),em=$('#ce').value.trim(),btn=$('#toPay'),er=$('#ckErr');
  if(!nm||ph.length<10){er.textContent='Preencha seu nome e WhatsApp com DDD para continuar.';return}
  btn.disabled=true;btn.textContent='Gerando pagamento…';er.textContent='';
  try{
   const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:Object.entries(cart).map(([id,q])=>({id,q})),name:nm,phone:ph,email:em})});
   let d={};try{d=await r.json()}catch(x){}
   if(!r.ok||!d.url)throw{s:r.status,d};
   const txt=MENU.filter(i=>cart[i.id]).map(i=>`${cart[i.id]}× ${i.n}`).join(', ');
   try{localStorage.setItem('pb_last',JSON.stringify({nm,txt}))}catch(e){}
   location.href=d.url;
  }catch(e){
   const s=e&&e.s,d=(e&&e.d)||{};console.error('checkout',s,d);
   er.textContent=!s?'Sem conexão com o servidor. Verifique a internet e tente de novo.'
    :(s===404||s===405)?'Servidor de pagamento não encontrado (/api/checkout). Confirme se a pasta api foi publicada na Vercel.'
    :d.error==='config'?'Servidor sem configuração. Falta: '+(d.missing||[]).join(', ')+'.'
    :d.error==='infinitepay'?'A InfinitePay recusou o pedido (código '+d.status+'). Fale com a loja no WhatsApp.'
    :'Não foi possível gerar o pagamento. Tente de novo ou fale com a loja no WhatsApp.';
   btn.disabled=false;btn.textContent='Pagar com Pix ou cartão'}
 };
}

async function renderReturn(q){
 const nsu=q.get('order_nsu'),tx=q.get('transaction_nsu'),sl=q.get('slug'),rc=q.get('receipt_url'),num=(nsu.split('-')[1]||'').toUpperCase();
 let last={};try{last=JSON.parse(localStorage.getItem('pb_last')||'{}')}catch(e){}
 const box=h=>{$('#m').innerHTML=`${stepsHtml(3)}<div class="card ctr">${h}</div>`};
 const help=`<a class="btn g" target="_blank" rel="noopener" href="${waLink('Olá! Tenho uma dúvida sobre o pedido #'+num)}">Falar com a loja</a>`;
 const again=`<button class="btn g" onclick="history.replaceState(null,'',location.pathname);cart={};renderMenu()">Fazer novo pedido</button>`;
 if(!tx||!sl){box(`<div class="big">Pedido #${esc(num)}</div><p class="mu">Se você já pagou, a loja recebe a confirmação automaticamente.</p>${help}${again}`);return}
 let paid=false;
 for(let i=0;i<8&&!paid;i++){
  box(`<div class="big">Verificando pagamento…</div><p class="mu">Pedido #${esc(num)}</p>`);
  try{const r=await fetch(`/api/status?order_nsu=${encodeURIComponent(nsu)}&transaction_nsu=${encodeURIComponent(tx)}&slug=${encodeURIComponent(sl)}`);paid=r.ok&&(await r.json()).paid}catch(e){}
  if(!paid)await new Promise(r=>setTimeout(r,3000));
 }
 if(paid){
  const msg=`Olá! Pedido #${num} pago${last.nm?' por '+last.nm:''}.${last.txt?' Itens: '+last.txt+'.':''}`;
  box(`<span class="badge">✅ Pagamento confirmado</span><div class="big">Pedido #${esc(num)}</div><p class="mu">Já avisamos a loja e seu pedido vai para a chapa.</p>${rc?`<a class="btn g" target="_blank" rel="noopener" href="${esc(rc)}">Ver comprovante</a>`:''}<a class="btn w" target="_blank" rel="noopener" href="${waLink(msg)}">Avisar a loja no WhatsApp</a>${again}`);
 }else{
  box(`<div class="big">Ainda não identificamos o pagamento</div><p class="mu">Pedido #${esc(num)}. Pix e cartão podem levar alguns instantes.</p><button class="btn" onclick="renderReturn(new URLSearchParams(location.search))">Verificar de novo</button>${help}`);
 }
}

$('#goCheckout').onclick=()=>{if(cartCount())renderCheckout()};
const _q=new URLSearchParams(location.search);
_q.get('order_nsu')?renderReturn(_q):renderMenu();
</script></body></html>
