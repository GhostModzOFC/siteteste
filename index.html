<style>

html{scroll-behavior:smooth;height:100%}*{box-sizing:border-box}

.md{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}

.ag{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.ck{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0}.ck label{margin:0;color:var(--tx)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.chart{display:flex;gap:8px;height:130px;margin:8px 0}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--mu)}.col i{display:block;width:70%;background:var(--ye);border-radius:6px 6px 0 0;min-height:2px}
.mu{color:var(--mu);font-size:13px}.late{border-color:var(--bad)}.arm{background:var(--bad)!important;color:#fff!important}.ok{color:var(--ok)}.er{color:var(--bad);font-size:14px;margin:6px 0}
#tk{display:none}footer{text-align:center;color:var(--mu);font-size:13px;padding:20px 0}footer a{color:var(--mu);cursor:pointer;text-decoration:underline}
@media print{body.pt>*:not(#tk){display:none!important}body.pt #tk{display:block;padding:10px;font:14px monospace;color:#000;background:#fff}}
</style></head><body>

<main class="w" id="m"></main><div id="bar"></div><div id="ov"></div><div id="toast"></div><div id="tk"></div>
<script>
const $=s=>document.querySelector(s),N=v=>parseFloat(v)||0,R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),uid=()=>Math.random().toString(36).slice(2,8),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
fd=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),dk=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,10);
const OPT={carne:[['Bovina 120g',0],['Bovina 180g',4],['Frango empanado',-1],['Vegana',2]],pao:[['Tradicional',0],['Brioche',2],['Sem glúten',3]],queijo:[['Prato',0],['Cheddar',1],['Sem queijo',-1]],mol:[['Maionese da casa',0],['Barbecue',0],['Ketchup',0],['Mostarda',0],['Molho especial',1.5]]};

return{cfg:{name:"Prime Burger's",wa:'',ig:'',pix:'',banner:'🔥 Combo X-Bacon com desconto hoje!',h1:'18:00',h2:'23:30',mode:'auto',free:0,pa:'1234',pf:'5678'},
cats:['Hambúrgueres','Combos','Batatas','Bebidas','Sobremesas','Adicionais'],

P('p5','Combo X-Bacon','Combos',42,'🍟','X-Bacon + batata + bebida à sua escolha','X-Bacon,Batata,Bebida',18,50,{pr:10}),P('p6','Combo Duplo','Combos',64,'👯','2 X-Burger + batata + 2 bebidas','2 X-Burger,Batata,2 Bebidas',30,15,{l2:0}),
P('p7','Batata frita','Batatas',16,'🍟','Porção crocante','Batata',5,45),P('p8','Batata cheddar e bacon','Batatas',24,'🧀','Com cheddar cremoso e bacon','Batata,Cheddar,Bacon',9,25),
P('p9','Refrigerante lata','Bebidas',6,'🥤','350 ml','',3.2,80),P('p10','Suco natural','Bebidas',9,'🍊','Sabor do dia','',3,20),P('p11','Milkshake','Sobremesas',18,'🥛','Chocolate ou morango','Leite,Sorvete',6,18),P('p12','Brownie','Sobremesas',12,'🍫','Com calda','',4,10,{l2:1}),
P('p13','Bacon extra','Adicionais',5,'🥓','','',2,0),P('p14','Ovo','Adicionais',3,'🍳','','',1,0),P('p15','Cheddar extra','Adicionais',4,'🧀','','',1.5,0),P('p16','Carne extra','Adicionais',8,'🥩','','',4,0)],
zones:[{n:'Centro',f:5,t:'30-40 min'},{n:'Bairro vizinho',f:8,t:'40-50 min'}],cps:[{code:'PRIME10',t:'%',v:10,min:30,on:1},{code:'5OFF',t:'R$',v:5,min:25,on:1},{code:'FRETE',t:'frete',v:0,min:40,on:1}],drv:['Entregador 1'],exp:[{n:'Aluguel',v:0},{n:'Funcionários',v:0}],
orders:[],seq:0,me:{n:'',w:'',a:'',num:'',bairro:'',comp:'',ref:''},pts:{},cus:{},fav:[]}}
let D;try{D=JSON.parse(localStorage.getItem('pbs'))}catch(e){}if(!D||!D.prods)D=def();
const save=()=>{try{localStorage.setItem('pbs',JSON.stringify(D))}catch(e){}};
let cart=[],cpn=null,usePts=false,fc='Todos',sq='',view='home',adm=null,atab='ped',pm=null,editId=null,ck={type:'Delivery',pay:'Pix',troco:'',...D.me};
const inR=r=>{const[a,b]=r.split('-').map(s=>{const[h,m]=s.split(':');return h*60+ +m}),n=new Date(),t=n.getHours()*60+n.getMinutes();return a<=b?t>=a&&t<=b:t>=a||t<=b};
const isOpen=()=>D.cfg.mode==='open'||(D.cfg.mode==='auto'&&inR(D.cfg.h1+'-'+D.cfg.h2));
const pp=p=>p.pr>0&&(!p.ph||inR(p.ph))?+(p.p*(1-p.pr/100)).toFixed(2):p.p;
const F=id=>D.prods.find(x=>x.id===id);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)};
const M=h=>{$('#ov').innerHTML=`<div class="bk" data-a="cl"></div><div class="md">${h}</div>`;$('#ov').style.display='block'},CL=()=>{$('#ov').style.display='none';$('#ov').innerHTML=''};
const wa=n=>{n=String(n||'').replace(/\D/g,'');return n&&!n.startsWith('55')?'55'+n:n},waL=(n,t)=>`https://wa.me/${wa(n)}?text=${encodeURIComponent(t)}`;
const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}};

function cardH(p){const pr=pp(p);return `<div class="pc${p.out?' out':''}"><div class="em">${p.e}</div><div class="pi"><div class="hr"><b>${esc(p.n)}</b><button class="hb" data-a="fv" data-i="${p.id}">${D.fav.includes(p.id)?'❤️':'🤍'}</button></div><small>${esc(p.d)}</small>${p.ing?`<small>Ingredientes: ${esc(p.ing)}</small>`:''}<div class="hr"><span class="pr">${pr<p.p?`<s>${R(p.p)}</s> `:''}${R(pr)}${p.l2?' <em class="tg">Leve 2 pague 1</em>':''}</span>${p.out?'<span class="tg bad">Esgotado</span>':`<button class="btn s" data-a="op" data-i="${p.id}">Adicionar</button>`}</div></div></div>`}

 return D.cats.map(c=>{const l=D.prods.filter(p=>f(p)&&p.c===c);return l.length?`<h2>${esc(c)}</h2>`+l.map(cardH).join(''):''}).join('')||'<p class="mu">Nenhum produto encontrado.</p>'}
const lst=()=>{const e=$('#lst');if(e)e.innerHTML=lstH()};
function home(){const c=D.cfg,op=isOpen(),ps=D.prods.filter(p=>p.on&&p.c!=='Adicionais'),top=[...ps].sort((a,b)=>b.sold-a.sold).slice(0,4),pr=ps.filter(p=>pp(p)<p.p);
 return `<section class="hero"><div class="logo">🍔</div><h1>${esc(c.name)}</h1><span class="pill ${op?'ok':'bad'}">${op?'🟢 Aberto agora':'🔴 Fechado no momento'}</span><p class="mu">Horário de funcionamento: ${c.h1} às ${c.h2}</p>
 ${c.banner?`<div class="ban">${esc(c.banner)}</div>`:''}<a class="btn" href="#cardapio">🍔 Fazer Pedido</a>${c.wa?`<a class="btn w" target="_blank" rel="noopener" href="https://wa.me/${wa(c.wa)}">WhatsApp</a>`:''}${c.ig?`<a class="btn g" target="_blank" rel="noopener" href="https://instagram.com/${esc(c.ig.replace('@',''))}">Instagram</a>`:''}</section>
 ${pr.length?`<h2>🏷️ Promoções</h2><div class="scr">${pr.map(cardH).join('')}</div>`:''}<h2>⭐ Mais vendidos</h2><div class="scr">${top.map(cardH).join('')}</div>
 <h2 id="cardapio">Cardápio</h2><input id="q" placeholder="🔍 Buscar produto..." value="${esc(sq)}"><div class="chips">${['Todos','fav',...D.cats].map(c=>`<button class="chip${fc===c?' on':''}" data-a="cat" data-i="${esc(c)}">${c==='fav'?'❤️ Favoritos':esc(c)}</button>`).join('')}</div><div id="lst">${lstH()}</div>
 <footer>Pedidos são enviados pelo WhatsApp da loja.<br><a data-a="orders">Meus pedidos</a> · <a data-a="login">Painel da loja</a></footer>`}
const newPm=p=>{const b=D.prods.filter(x=>x.c==='Bebidas'&&x.on&&!x.out),a=D.prods.filter(x=>x.c==='Batatas'&&x.on&&!x.out);return{id:p.id,q:1,carne:OPT.carne[0][0],pao:OPT.pao[0][0],queijo:OPT.queijo[0][0],ex:[],mol:[],rem:[],obs:'',beb:b[0]?b[0].n:'',ac:a[0]?a[0].n:''}};
function pmPrice(){const p=F(pm.id);let u=pp(p);if(p.opts){const g=(k)=>(OPT[k].find(x=>x[0]===pm[k])||[0,0])[1];u+=g('carne')+g('pao')+g('queijo')+pm.mol.reduce((a,m)=>a+(OPT.mol.find(x=>x[0]===m)||[0,0])[1],0)+pm.ex.reduce((a,id)=>a+(F(id)?pp(F(id)):0),0)}return u}
function pmDet(){const p=F(pm.id),d=[];if(p.opts){d.push(pm.carne,pm.pao,pm.queijo);pm.ex.forEach(id=>d.push('+'+F(id).n));pm.mol.forEach(m=>d.push(m));pm.rem.forEach(r=>d.push('sem '+r))}if(p.combo)d.push(pm.beb,pm.ac);return d.filter(Boolean).join(', ')}
const pt=()=>{const e=$('#pt');if(e)e.textContent=R(pmPrice()*pm.q)};
function pmH(){const p=F(pm.id),rad=(t,k,a)=>`<div class="opt"><b>${t}</b>${a.map(x=>`<label><input type="radio" name="${k}" data-pm="${k}" value="${esc(x[0])}" ${pm[k]===x[0]?'checked':''}> ${esc(x[0])}${x[1]?` <small>(${x[1]>0?'+':''}${R(x[1])})</small>`:''}</label>`).join('')}</div>`,chk=(t,k,a)=>`<div class="opt"><b>${t}</b>${a.map(x=>`<label><input type="checkbox" data-pmx="${k}" value="${esc(x[0])}" ${pm[k].includes(x[0])?'checked':''}> ${esc(x[1])}${x[2]?` <small>(+${R(x[2])})</small>`:''}</label>`).join('')}</div>`;

 return `<h2 style="margin-top:0">${p.e} ${esc(p.n)}</h2><p class="mu">${esc(p.d)}</p>

 ${p.combo?rad('Escolha a bebida','beb',D.prods.filter(x=>x.c==='Bebidas'&&x.on&&!x.out).map(x=>[x.n,0]))+rad('Escolha o acompanhamento','ac',D.prods.filter(x=>x.c==='Batatas'&&x.on&&!x.out).map(x=>[x.n,0])):''}

function addLine(it){const x=cart.find(c=>c.pid===it.pid&&c.det===it.det&&c.obs===it.obs&&!it.pm);if(x)x.q+=it.q;else cart.push(it);rnd()}
function tot(){const sub=cart.reduce((a,i)=>a+i.u*i.q-(i.l2?Math.floor(i.q/2)*i.u:0),0),z=D.zones.find(x=>x.n===ck.bairro);let dc=0,fr=0,free=false;
