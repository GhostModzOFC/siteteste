<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#14171a"><title>Pagamento · Prime Burger's</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#16191d;--mu:#667085;--bd:#e4e7ec;--ac:#d62d20;--ye:#ffb400;--ok:#12805c;--bad:#c0281c;--soft:#f7f8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0e1113;--card:#171b1f;--tx:#eef0f2;--mu:#98a2ad;--bd:#293038;--soft:#1e2328;--ok:#34c48f;--bad:#ff6b5e}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1113;--card:#171b1f;--tx:#eef0f2;--mu:#98a2ad;--bd:#293038;--soft:#1e2328;--ok:#34c48f;--bad:#ff6b5e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#14171a,#262b31);color:#fff;border-bottom:3px solid var(--ye)}
.w{max-width:560px;margin:0 auto;padding:0 14px}.hb{display:flex;align-items:center;gap:10px;padding:14px 0}.hb b{font:700 21px Oswald,Impact,sans-serif;letter-spacing:.5px}.hb small{display:block;color:#b8bec6;font-size:12px}
h2{font:700 21px Oswald,Impact,sans-serif;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.row.t{font:700 22px Oswald,sans-serif;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}.ok{color:var(--ok)}
label{display:block;font-size:13px;color:var(--mu);font-weight:500;margin-bottom:8px}
input{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:13px;font:inherit;width:100%;margin-top:4px}input:focus{outline:0;border-color:var(--ac)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:linear-gradient(135deg,#e8402f,var(--ac));color:#fff;border:0;border-radius:14px;padding:16px;font:700 17px Inter,sans-serif;cursor:pointer;margin:8px 0;min-height:52px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:15px}.btn.w{background:#128c4a}.btn:disabled{opacity:.55}
.mu{color:var(--mu);font-size:13px}.er{color:var(--bad);font-size:14px;margin:8px 0}.big{font-size:54px;text-align:center}.ctr{text-align:center}
.sel{display:flex;gap:8px;margin:6px 0 10px}
.sel button{flex:1;text-align:center;padding:12px 10px;border:1px solid var(--bd);border-radius:12px;font:700 14px Inter,sans-serif;background:var(--card);color:var(--mu);cursor:pointer}
.sel button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.qrwrap{text-align:center;padding:6px 0 4px}.qrwrap canvas{border-radius:12px;border:1px solid var(--bd);background:#fff;padding:8px;max-width:100%}
.codebox{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.codebox input{font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.copybtn{flex:0 0 auto;background:var(--soft);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:0 16px;font:700 13px Inter,sans-serif;cursor:pointer}
.copybtn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.panel{display:none}.panel.on{display:block}
.badge{display:inline-block;font-size:11px;font-weight:700;background:#e6f6ee;color:var(--ok);border-radius:8px;padding:3px 8px;margin-bottom:8px}
:root[data-theme=dark] .badge,body.dark .badge{background:#0f2b21}
</style></head><body>
<header><div class="w"><div class="hb"><span style="font-size:28px">🍔</span><div><b id="nm">Prime Burger's</b><small>🔒 Pagamento seguro</small></div></div></div></header>
<main class="w" id="m"></main>
<script>
const $=s=>document.querySelector(s),N=v=>parseFloat(String(v).replace(',','.'))||0,R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API='https://api.infinitepay.io/invoices/public/checkout',Q=new URLSearchParams(location.search);
let O=null;try{if(location.hash.startsWith('#p='))O=JSON.parse(decodeURIComponent(location.hash.slice(3)))}catch(e){}
if(!O)O={manual:0,nm:"Prime Burger's",num:'0001',h:'primeburgersmg',pix:'96e8723f-e70a-4c8e-87a6-b4a7903e7c58',mn:"Prime Burgers",mc:'Uberlandia',wa:'34996982496',n:'',w:'',it:[{n:'X-Bacon Duplo',q:1,u:28.9},{n:'Batata Frita Grande',q:1,u:14.9},{n:'Coca-Cola Lata',q:2,u:6}],fr:6,dc:0};
$('#nm').textContent=O.nm||"Prime Burger's";
let tab='pix';
const wa=n=>{n=String(n||'').replace(/\D/g,'');return n&&!n.startsWith('55')?'55'+n:n};
const waL=t=>O.wa?`https://wa.me/${wa(O.wa)}?text=${encodeURIComponent(t)}`:'';
const cents=v=>Math.round(v*100);
function lines(){
 const L=O.it.map(i=>({d:(i.q>1?i.q+'x ':'')+i.n,c:cents(i.u*i.q-(i.l2?Math.floor(i.q/2)*i.u:0))})).filter(l=>l.c>0),sub=L.reduce((a,l)=>a+l.c,0),dc=Math.min(cents(N(O.dc)),sub);
 if(dc>0&&sub>0){const tgt=sub-dc;let s=0;L.forEach(l=>{l.c=Math.round(l.c*tgt/sub);s+=l.c});if(L.length)L[L.length-1].c+=tgt-s}
 if(cents(N(O.fr))>0)L.push({d:'Taxa de entrega',c:cents(N(O.fr))});return L.filter(l=>l.c>0)}
const total=()=>lines().reduce((a,l)=>a+l.c,0)/100;

/* ---------- Pix BR Code (EMV) — gerado 100% no navegador, sem depender de nenhuma API ---------- */
function crc16(str){let crc=0xFFFF;for(let i=0;i<str.length;i++){crc^=(str.charCodeAt(i)<<8);for(let b=0;b<8;b++){crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF}}return crc.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function pixSan(s,max){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').toUpperCase().trim().slice(0,max)||'NA'}
function buildPixCode(key,name,city,amount,txid){
 key=String(key||'').trim();
 let mai=tlv('00','br.gov.bcb.pix')+tlv('01',key);
 let p=tlv('00','01')+tlv('01','11')+tlv('26',mai)+tlv('52','0000')+tlv('53','986');
 if(amount>0)p+=tlv('54',amount.toFixed(2));
 p+=tlv('58','BR')+tlv('59',pixSan(name,25))+tlv('60',pixSan(city,15));
 const tx=(String(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25))||'***';
 p+=tlv('62',tlv('05',tx));
 p+='6304';
 return p+crc16(p)
}
let copyTimer=null;
async function copyPix(){
 const val=$('#pixcode').value,btn=$('#cpbtn');
 try{await navigator.clipboard.writeText(val)}
 catch(e){const t=document.createElement('textarea');t.value=val;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e2){}document.body.removeChild(t)}
 btn.textContent='Copiado!';btn.classList.add('done');clearTimeout(copyTimer);copyTimer=setTimeout(()=>{btn.textContent='Copiar';btn.classList.remove('done')},2200)
}
function renderPix(){
 const key=O.manual?$('#pk')?.value:O.pix,name=O.manual?$('#mn')?.value:(O.mn||O.nm),city=O.manual?$('#mc')?.value:(O.mc||'BRASIL'),
 box=$('#pixbox'),err=$('#pixerr');if(!box)return;
 if(!key){err.textContent='A loja ainda não configurou a Chave Pix.';box.style.display='none';return}
 if(total()<=0){err.textContent='Informe um valor maior que zero.';box.style.display='none';return}
 err.textContent='';box.style.display='block';
 const code=buildPixCode(key,name,city,total(),'PB'+String(O.num||'').replace(/\W/g,''));
 $('#pixcode').value=code;
 QRCode.toCanvas($('#pixqr'),code,{width:220,margin:1,color:{dark:'#16191d',light:'#ffffff'}},function(){});
}
function setTab(t){tab=t;$('#tb-pix').classList.toggle('on',t==='pix');$('#tb-card').classList.toggle('on',t==='card');
 $('#panel-pix').classList.toggle('on',t==='pix');$('#panel-card').classList.toggle('on',t==='card');
 if(t==='pix')renderPix()}

function view(){const L=lines();
 $('#m').innerHTML=`<h2>Pedido ${O.manual?'':'#'+esc(O.num)}</h2><div class="card">${O.manual?`<label>Descrição<input id="md" value="${esc(O.it[0].n)}" placeholder="Ex.: 2 X-Bacon"></label><label>Valor (R$)<input id="mv" inputmode="decimal" value="${O.it[0].u||''}" placeholder="0,00"></label><label>InfiniteTag da loja, sem $ (para pagar com cartão)<input id="hd" value="${esc(O.h)}"></label><label>Chave Pix da loja (CPF, CNPJ, e-mail, telefone ou aleatória)<input id="pk" value="${esc(O.pix)}"></label><label>Nome do recebedor (máx. 25 letras)<input id="mn" value="${esc(O.mn||O.nm)}" maxlength="25"></label><label>Cidade (máx. 15 letras)<input id="mc" value="${esc(O.mc)}" maxlength="15" placeholder="Ex.: SAO PAULO"></label>`:
 O.it.map(i=>`<div class="row"><span>${i.q}× ${esc(i.n)}${i.det?`<br><small class="mu">${esc(i.det)}</small>`:''}</span><span>${R(i.u*i.q-(i.l2?Math.floor(i.q/2)*i.u:0))}</span></div>`).join('')+(O.fr>0?`<div class="row"><span>Taxa de entrega</span><span>${R(O.fr)}</span></div>`:'')+(O.dc>0?`<div class="row"><span>Desconto</span><span class="ok">−${R(O.dc)}</span></div>`:'')}
 <div class="row t"><span>Total</span><span id="tt">${R(total())}</span></div></div>
 <h2>Seus dados</h2><div class="card"><label>Nome<input id="cn" value="${esc(O.n)}"></label><label>WhatsApp (com DDD)<input id="cw" inputmode="tel" value="${esc(O.w)}"></label><label>E-mail (opcional)<input id="ce" type="email"></label></div>
 <div class="sel"><button id="tb-pix" type="button">💠 Pix</button><button id="tb-card" type="button">💳 Cartão</button></div>

 <div class="panel" id="panel-pix"><div class="card">
  <span class="badge">Pix grátis · cai na hora</span>
  <div class="er" id="pixerr"></div>
  <div id="pixbox">
   <div class="qrwrap"><canvas id="pixqr"></canvas></div>
   <p class="mu ctr">Escaneie com o app do seu banco, ou copie o código abaixo e cole na opção "Pix Copia e Cola".</p>
   <div class="codebox"><input id="pixcode" readonly></div>
   <button class="btn g" id="cpbtn" type="button" style="margin-top:10px">Copiar código Pix</button>
   ${waL('')?`<a class="btn w" target="_blank" rel="noopener" href="${waL(`Olá! Acabei de pagar o pedido #${O.num||''} (${R(total())}) via Pix. Segue o comprovante.`)}">Já paguei, avisar a loja</a>`:''}
  </div>
 </div></div>

 <div class="panel" id="panel-card"><div class="card">
  <p class="mu">Pagamento com cartão de crédito processado pela InfinitePay.</p>
  <div class="er" id="er"></div>
  <button class="btn" id="pb">Pagar ${R(total())} com Cartão</button>
 </div></div>

 ${waL('')?`<a class="btn g" target="_blank" rel="noopener" href="${waL(`Olá! Pedido #${O.num||''} (${R(total())}). Prefiro pagar na entrega/retirada.`)}">Prefiro pagar na entrega ou retirada</a>`:''}
 <p class="mu ctr">Não pedimos dados de cartão neste site.</p>`;
 $('#tb-pix').onclick=()=>setTab('pix');$('#tb-card').onclick=()=>setTab('card');$('#cpbtn').onclick=copyPix;$('#pb').onclick=pay;
 const up=()=>{if(O.manual){O.it[0].n=$('#md').value;O.it[0].u=N($('#mv').value);O.h=$('#hd').value;O.pix=$('#pk').value;O.mn=$('#mn').value;O.mc=$('#mc').value}
  $('#tt').textContent=R(total());$('#pb').textContent='Pagar '+R(total())+' com Cartão';renderPix()};
 if(O.manual)['#md','#mv','#hd','#pk','#mn','#mc'].forEach(s=>$(s).oninput=up);
 setTab('pix')}

async function pay(){const er=m=>{$('#er').textContent=m},b=$('#pb'),h=String(O.manual?$('#hd').value:O.h||'').replace('$','').trim(),L=lines();
 if(!h)return er('A loja ainda não configurou a InfiniteTag. Fale com a loja pelo WhatsApp.');
 if(!L.length||total()<=0)return er('Informe um valor maior que zero.');const nm=$('#cn').value.trim(),ph=$('#cw').value.replace(/\D/g,''),em=$('#ce').value.trim();
 if(!nm||ph.length<10)return er('Informe seu nome e WhatsApp com DDD.');
 const ns='PB'+String(O.num).replace(/\W/g,'')+'-'+Date.now().toString(36),ru=O.r||(location.protocol==='https:'?location.origin+location.pathname:''),
 body={handle:h,order_nsu:ns,items:L.map(l=>({quantity:1,price:l.c,description:l.d.slice(0,120)})),customer:{name:nm,phone_number:'+'+wa(ph),...(em?{email:em}:{})}};if(ru)body.redirect_url=ru;
 b.disabled=true;b.textContent='Gerando link de pagamento...';er('');
 try{const r=await fetch(API+'/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();
  let ok=false;try{const u=new URL(d.url);ok=u.protocol==='https:'&&/(^|\.)infinitepay\.(com\.br|io)$/.test(u.hostname)}catch(e){}
  if(!ok)throw new Error('resp');
  try{localStorage.setItem('pbck_'+ns,JSON.stringify({h,num:O.num,total:total(),wa:O.wa||'',nm:O.nm||'',st:'aguardando',ts:Date.now()}))}catch(e){}
  b.textContent='Abrindo pagamento...';location.href=d.url}
 catch(e){b.disabled=false;b.textContent='Tentar novamente';er('Não consegui gerar o link de pagamento agora. Confira se a InfiniteTag está certa e tente de novo. Se continuar, combine o pagamento pelo WhatsApp da loja.')}}
async function back(){const ns=Q.get('order_nsu'),tx=Q.get('transaction_nsu'),sl=Q.get('slug'),rc=Q.get('receipt_url'),cm=Q.get('capture_method');let rec={};try{rec=JSON.parse(localStorage.getItem('pbck_'+ns))||{}}catch(e){}
 if(rec.nm)$('#nm').textContent=rec.nm;$('#m').innerHTML=`<div class="card ctr"><div class="big">⏳</div><b>Confirmando seu pagamento...</b></div>`;let paid=null;
 if(rec.h){try{const r=await fetch(API+'/payment_check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:rec.h,order_nsu:ns,transaction_nsu:tx,slug:sl})}),d=await r.json();paid=d.paid===true?true:d.paid===false?false:null}catch(e){}}
 const rcOk=rc&&/^https:\/\//.test(rc),how=cm==='pix'?'Pix':cm==='credit_card'?'cartão':'InfinitePay',num=rec.num||ns,
 msg=`Olá! Paguei o pedido #${num} via ${how}.${rcOk?' Comprovante: '+rc:''}`;
 if(rec.h&&paid!==false){rec.st=paid?'pago':'a conferir';try{localStorage.setItem('pbck_'+ns,JSON.stringify(rec))}catch(e){}}
 $('#m').innerHTML=`<div class="card ctr"><div class="big">${paid?'✅':paid===false?'❌':'🕒'}</div><h2 style="margin:0">${paid?'Pagamento confirmado!':paid===false?'Pagamento não confirmado':'Pagamento recebido pela InfinitePay'}</h2><p class="mu">${paid?`Pedido #${esc(num)} pago via ${how}. A loja já pode preparar.`:paid===false?'Não encontramos a confirmação. Fale com a loja.':'Não consegui confirmar automaticamente daqui. A loja confere no app da InfinitePay antes de liberar o pedido.'}</p>${rcOk?`<a class="btn g" target="_blank" rel="noopener" href="${esc(rc)}">Ver comprovante</a>`:''}${rec.wa?`<a class="btn w" target="_blank" rel="noopener" href="https://wa.me/${wa(rec.wa)}?text=${encodeURIComponent(msg)}">Avisar a loja no WhatsApp</a>`:''}</div>`}
Q.get('order_nsu')&&Q.get('transaction_nsu')?back():view();
</script></body></html>
