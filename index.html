<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#14171a"><title>Prime Burger's</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#16191d;--mu:#667085;--bd:#e4e7ec;--ac:#d62d20;--ye:#ffb400;--ok:#12805c;--bad:#c0281c;--soft:#f7f8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1113;--card:#171b1f;--tx:#eef0f2;--mu:#98a2ad;--bd:#293038;--soft:#1e2328;--ok:#34c48f;--bad:#ff6b5e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{background:linear-gradient(135deg,#14171a,#262b31);color:#fff;border-bottom:3px solid var(--ye);position:sticky;top:0;z-index:5}
.w{max-width:560px;margin:0 auto;padding:0 14px}.hb{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.hb b{font:700 22px Oswald,Impact,sans-serif;letter-spacing:.5px}.hb small{display:block;color:#b8bec6;font-size:12px}
h2{font:700 20px Oswald,Impact,sans-serif;margin:18px 0 10px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.item .ic{font-size:32px;flex:0 0 auto}.item .info{flex:1;min-width:0}.item .info b{display:block;font-size:15px}
.item .info span{color:var(--mu);font-size:12.5px;display:block;margin:2px 0 6px}.item .price{color:var(--ac);font-weight:700}
.stepper{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font:700 18px Inter;cursor:pointer}
.stepper button.add{background:var(--ac);border-color:var(--ac);color:#fff}
.stepper span{min-width:16px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.bar .w{display:flex;align-items:center;gap:12px;padding:0}
.bar .tot{flex:1}.bar .tot b{display:block;font:700 19px Oswald,sans-serif}.bar .tot span{color:var(--mu);font-size:12px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:linear-gradient(135deg,#e8402f,var(--ac));color:#fff;border:0;border-radius:14px;padding:15px;font:700 16px Inter,sans-serif;cursor:pointer;min-height:50px}
.btn.g{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}.btn.w{background:#128c4a}.btn:disabled{opacity:.55}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.row.t{font:700 22px Oswald,sans-serif;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}.ok{color:var(--ok)}
label{display:block;font-size:13px;color:var(--mu);font-weight:500;margin-bottom:8px}
input{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:13px;font:inherit;width:100%;margin-top:4px}input:focus{outline:0;border-color:var(--ac)}
.mu{color:var(--mu);font-size:13px}.ctr{text-align:center}.big{font-size:44px;text-align:center;margin-top:2px}.er{color:var(--bad);font-size:13.5px;min-height:18px;margin-top:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;background:#e6f6ee;color:var(--ok);border-radius:8px;padding:4px 9px;margin-bottom:10px}
.back{display:inline-block;color:var(--mu);text-decoration:none;font-size:13px;margin-bottom:6px;cursor:pointer}
.bigicon{font-size:54px;text-align:center}
</style></head><body>
<header><div class="w"><div class="hb"><div><b>🍔 Prime Burger's</b><small>Peça e pague com verificação automática</small></div><div id="cartTag" class="mu" style="font-size:13px"></div></div></div></header>
<main class="w" id="m"></main>
<div class="bar" id="bar" style="display:none"><div class="w"><div class="tot"><span>Total</span><b id="barTot">R$ 0,00</b></div><div style="flex:1"><button class="btn" id="goCheckout" type="button">Finalizar pedido</button></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),Q=new URLSearchParams(location.search);

/* ---- configuração da loja ---- */
const STORE={nm:"Prime Burger's",wa:'34996982496',handle:'primeburgersmg'};
const API='https://api.checkout.infinitepay.io';
const MENU=[
 {id:'xb',n:'X-Burger',d:'Pão, hambúrguer 120g, queijo, alface e tomate',p:18.9,e:'🍔'},
 {id:'xbc',n:'X-Bacon',d:'Pão, hambúrguer 120g, queijo, bacon crocante',p:22.9,e:'🥓'},
 {id:'xsal',n:'X-Salada',d:'Pão, hambúrguer 120g, queijo, alface, tomate e maionese da casa',p:20.9,e:'🥬'},
 {id:'xtudo',n:'X-Tudo',d:'Pão, 2 hambúrgueres, queijo, bacon, ovo, presunto e salada',p:29.9,e:'🍖'},
 {id:'bat',n:'Batata Frita',d:'Porção individual crocante',p:14.9,e:'🍟'},
 {id:'ref',n:'Refrigerante Lata',d:'350ml, várias opções',p:6,e:'🥤'}
];
let cart={};
const cartCount=()=>Object.values(cart).reduce((a,q)=>a+q,0);
const cartTotal=()=>MENU.reduce((a,i)=>a+(cart[i.id]||0)*i.p,0);
const wa=n=>{n=String(n||'').replace(/\D/g,'');return n&&!n.startsWith('55')?'55'+n:n};
function setQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];renderMenu();renderBar()}

function renderMenu(){
 $('#cartTag').textContent=cartCount()?cartCount()+' item(ns)':'';
 $('#m').innerHTML='<h2>Cardápio</h2>'+MENU.map(i=>`<div class="item"><div class="ic">${i.e}</div><div class="info"><b>${esc(i.n)}</b><span>${esc(i.d)}</span><span class="price">${R(i.p)}</span></div><div class="stepper">${cart[i.id]?`<button onclick="setQty('${i.id}',-1)">−</button><span>${cart[i.id]}</span>`:''}<button class="add" onclick="setQty('${i.id}',1)">+</button></div></div>`).join('');
 $('#bar').style.display=cartCount()?'flex':'none';
}
function renderBar(){$('#bar').style.display=cartCount()?'flex':'none';$('#barTot').textContent=R(cartTotal())}
function backMenu(){renderMenu();renderBar()}
function goCheckout(){if(!cartCount())return;renderCheckout()}

function renderCheckout(){
 const total=cartTotal();
 const itemsHtml=MENU.filter(i=>cart[i.id]).map(i=>`<div class="row"><span>${cart[i.id]}× ${esc(i.n)}</span><span>${R(i.p*cart[i.id])}</span></div>`).join('');
 $('#m').innerHTML=`<a class="back" onclick="backMenu()">‹ Voltar ao cardápio</a><h2>Seu pedido</h2>
 <div class="card">${itemsHtml}<div class="row t"><span>Total</span><span>${R(total)}</span></div></div>
 <div class="card"><label>Nome<input id="cn" placeholder="Seu nome"></label><label>WhatsApp (com DDD)<input id="cw" inputmode="tel" placeholder="34 99999-9999"></label></div>
 <div class="card ctr"><span class="badge">🔒 Pagamento com verificação automática · InfinitePay</span>
  <p class="mu" style="margin:0">Pix ou cartão — você escolhe na próxima tela. Assim que pagar, voltamos pra cá e confirmamos sozinhos.</p>
  <div class="big">${R(total)}</div>
  <div class="er" id="ckErr"></div>
  <button class="btn" id="payBtn" type="button">Pagar ${R(total)}</button>
 </div>`;
 $('#bar').style.display='none';
 $('#payBtn').onclick=pay;
}

async function pay(){
 const er=m=>{$('#ckErr').textContent=m},btn=$('#payBtn'),nm=$('#cn').value.trim(),ph=$('#cw').value.replace(/\D/g,'');
 if(!nm||ph.length<10)return er('Informe seu nome e WhatsApp com DDD.');
 const items=MENU.filter(i=>cart[i.id]).map(i=>({quantity:cart[i.id],price:Math.round(i.p*100),description:i.n})),
 total=cartTotal(),ns='PB'+Date.now().toString(36).toUpperCase(),ru=location.origin+location.pathname,
 body={handle:STORE.handle,order_nsu:ns,items,redirect_url:ru,customer:{name:nm,phone_number:'+'+wa(ph)}};
 btn.disabled=true;btn.textContent='Gerando pagamento seguro...';er('');
 let r,d;
 try{
  r=await fetch(API+'/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 }catch(networkErr){
  btn.disabled=false;btn.textContent='Pagar '+R(total);
  er('Falha de conexão ao chamar a InfinitePay (pode ser bloqueio de CORS ou sem internet). Detalhe: '+(networkErr.message||networkErr));
  return;
 }
 try{d=await r.json()}catch(e){d={}}
 if(!r.ok){
  btn.disabled=false;btn.textContent='Pagar '+R(total);
  er('A InfinitePay recusou o pedido (HTTP '+r.status+'). '+(d.message||d.error||JSON.stringify(d).slice(0,200)||'Confira se o Checkout está ativado na sua conta e se a InfiniteTag "'+STORE.handle+'" está certa.'));
  return;
 }
 let ok=false;try{const u=new URL(d.url);ok=u.protocol==='https:'&&/(^|\.)infinitepay\.(com\.br|io)$/.test(u.hostname)}catch(e){}
 if(!ok){
  btn.disabled=false;btn.textContent='Pagar '+R(total);
  er('A InfinitePay respondeu, mas sem um link de pagamento válido. Resposta: '+JSON.stringify(d).slice(0,200));
  return;
 }
 try{localStorage.setItem('pbord_'+ns,JSON.stringify({nm,wa:ph,total,items,st:'aguardando',ts:Date.now()}))}catch(e){}
 btn.textContent='Abrindo pagamento...';location.href=d.url;
}

async function checkPayment(){
 const ns=Q.get('order_nsu'),tx=Q.get('transaction_nsu'),sl=Q.get('slug'),rc=Q.get('receipt_url'),cm=Q.get('capture_method');
 let rec={};try{rec=JSON.parse(localStorage.getItem('pbord_'+ns))||{}}catch(e){}
 $('#m').innerHTML=`<div class="card ctr"><div class="bigicon">⏳</div><b>Confirmando seu pagamento...</b><p class="mu">Estamos verificando direto com a InfinitePay, um instante.</p></div>`;
 $('#bar').style.display='none';
 let paid=null;
 try{
  const r=await fetch(API+'/payment_check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:STORE.handle,order_nsu:ns,transaction_nsu:tx,slug:sl})}),d=await r.json();
  paid=d.paid===true?true:d.paid===false?false:null;
 }catch(e){}
 const how=cm==='pix'?'Pix':cm==='credit_card'?'cartão':'InfinitePay',rcOk=rc&&/^https:\/\//.test(rc),
 msg=`Olá! Meu nome é ${rec.nm||''}. Acabei de pagar meu pedido via ${how} (${R(rec.total||0)}) e o pagamento já foi confirmado automaticamente.${rcOk?' Comprovante: '+rc:''}`;
 if(rec.nm){rec.st=paid?'pago':(paid===false?'nao_confirmado':'a_conferir');try{localStorage.setItem('pbord_'+ns,JSON.stringify(rec))}catch(e){}}
 $('#m').innerHTML=`<div class="card ctr">
  <div class="bigicon">${paid?'✅':paid===false?'❌':'🕒'}</div>
  <h2 style="margin:6px 0">${paid?'Pagamento confirmado!':paid===false?'Pagamento não confirmado':'Ainda processando'}</h2>
  <p class="mu">${paid?`Recebemos a confirmação automática do seu pagamento via ${how}. Sua loja já foi avisada e vai preparar o pedido.`:paid===false?'Não encontramos a confirmação desse pagamento. Se você já pagou, fale com a loja pelo WhatsApp.':'Ainda não conseguimos confirmar automaticamente. Se o pagamento foi concluído, isso pode levar alguns segundos — tente atualizar, ou fale com a loja.'}</p>
  ${rcOk?`<a class="btn g" target="_blank" rel="noopener" href="${esc(rc)}">Ver comprovante</a>`:''}
  ${STORE.wa&&paid?`<a class="btn w" target="_blank" rel="noopener" href="https://wa.me/${wa(STORE.wa)}?text=${encodeURIComponent(msg)}">Avisar a loja no WhatsApp</a>`:''}
  <a class="btn g" href="${location.origin+location.pathname}">Fazer novo pedido</a>
 </div>`;
}

if(Q.get('order_nsu')&&Q.get('transaction_nsu')){checkPayment()}else{renderMenu();renderBar();$('#goCheckout').onclick=goCheckout}
</script></body></html>
